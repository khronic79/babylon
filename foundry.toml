[profile.default]
src = "contracts"
test = "test/foundry"
out = "foundry-out"
cache_path = "foundry-cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[rpc_endpoints]
polygon = "https://polygon-rpc.com"
